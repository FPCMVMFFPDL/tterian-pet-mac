:root{
  --pet-bubble-bg:#ffffff;

html,body{
  margin:0;

  overflow:hidden;
  background:transparent;
  font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif
}
canvas{
  position:absolute;
  left:0;
  top:0;
  transform-origin:50% 60%;
  pointer-events:none
}
.bub{
  --bubble-img:none;
  position:absolute;
  left:0;
  top:0;
  opacity:0;
  white-space:normal;
  max-width:260px;
  text-align:center;
  background:var(--pet-bubble-bg) var(--bubble-img) center/100% 100% no-repeat;
  color:var(--pet-bubble-text);
  border:2px solid var(--pet-bubble-border);
  border-radius:var(--pet-bubble-radius);
  padding:8px 12px;
  font-size:var(--pet-bubble-font-size);
  pointer-events:none;
  transition:opacity .15s;
  box-sizing:border-box;
  z-index:8
}
.bub.img{
  border:0;
  border-radius:0;
  padding:14px 22px
}
.bub.recommend-card{
  width:280px;
  max-width:280px;
  text-align:left;
  padding:15px 17px;
  border:2px solid #E80028;
  border-radius:16px;
  background:#fff;
  box-shadow:0 8px 24px #1f2a4420;
  white-space:normal
}
.recommend-card .rec-kicker{
  font-size:15px;
  font-weight:800;
  color:#E80028;
  letter-spacing:.02em;
  margin-bottom:7px
}
.recommend-card .rec-name{
  font-size:19px;
  font-weight:900;
  color:#202536;
  line-height:1.25;
  margin-bottom:8px
}
.recommend-card .rec-desc{
  font-size:13px;
  font-weight:500;
  color:#4b5563;
  line-height:1.5
}
.fortune-card .rec-name{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px
}
.fortune-card .rec-stars{
  font-size:16px;
  color:#f5a623;
  letter-spacing:1px;
  white-space:nowrap
}
.fortune-card .rec-lucky{
  margin-top:11px;
  padding-top:10px;
  border-top:1px dashed #f3b6c0;
  font-size:12.5px;
  font-weight:800;
  color:#E80028
}
#menu{
  position:absolute;
  display:none;
  flex-direction:column;
  min-width:170px;
  padding:6px;
  background:var(--menu-bg);
  color:var(--menu-text);
  border:1px solid var(--menu-border);
  border-radius:var(--menu-radius);
  box-shadow:0 6px 24px #0003;
  z-index:9
}
#menu button{
  font:inherit;
  font-size:14px;
  text-align:left;
  padding:9px 12px;
  border:0;
  border-radius:8px;
  background:none;
  cursor:pointer;
  color:var(--menu-text)
}
#menu button:hover{background:#eef1fa}
.menu-divider{
  height:0;
  margin:5px 8px;
  border-top:1px dashed #b8bfd0;
  flex-shrink:0
}
.resize-handle{
  position:absolute;
  display:none;
  left:0;
  top:0;
  width:24px;
  height:24px;
  border:0;
  border-radius:8px;
  background:#fff;
  color:#334155;
  box-shadow:0 2px 8px #0003;
  z-index:10;
  cursor:nwse-resize;
  font-size:17px;
  line-height:24px;
  padding:0;
  pointer-events:auto
}
.resize-handle.visible{display:block}
.heart{
  position:absolute;
  color:#FF0000;
  font-size:22px;
  pointer-events:none;
  animation:up 1s ease-out forwards
}
@keyframes up{
  from{opacity:1;transform:translateY(0)}
  to{opacity:0;transform:translateY(-50px)}
}
</style>

let lastLine = '';

const rnd = a => a[Math.floor(Math.random() * a.length)];

const pickLine = a => {
  let t;
  do {
    t = rnd(a);
  } while (t === lastLine && a.length > 1);
  lastLine = t;
  return t;
};

const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const exists = p => fs.existsSync(path.join(ROOT, p));

const loadImg = src => {
  const i = new Image();
  i.ok = false;
  i.onload = () => i.ok = true;
  i.src = src;
  return i;
};

const chairImg = exists('shared/chair.png')
  ? loadImg('shared/chair.png')
  : null;

const bubbleImg = exists('shared/bubble.png');

let pets = [],
    dp = null,
    over = false,
    mouseX = -9999,
    mouseY = -9999,
    lastTypingActivity = 0,
    lastInputAt = performance.now();

let petPositions = {};

try {
  petPositions = JSON.parse(localStorage.getItem('petPositions') || '{}') || {};
} catch {}

const savePetPositions = () =>
  localStorage.setItem('petPositions', JSON.stringify(petPositions));

const menu = document.getElementById('menu');

class Pet {
  constructor(id) {
const dir = path.join(ROOT, 'characters', id);

const c = this.cfg = JSON.parse(
  fs.readFileSync(path.join(dir, 'character.json'), 'utf8')
);

    this.id = id;
    this.S = Number.isFinite(petPositions[id]?.size)
      ? petPositions[id].size
      : (c.size || 200);

    this.fy = (c.feetY || .89) * this.S;
    this.color = c.color || '#8fe3cf';
    this.lines = c.lines || DL;
    this.chat = c.chatLines || DC;
    this.fps = Object.assign({}, FPS, c.fps);
    this.frames = {};

    for (const s of STATES) {
      const d = path.join(dir, s);
      if (!fs.existsSync(d)) continue;

      const f = fs.readdirSync(d)
        .filter(n => /\.png$/i.test(n) &&
          (s !== 'idle' || /idle_0[12]\.png$/i.test(n)))
        .sort();

      if (f.length) {
        this.frames[s] = f.map(n =>
          loadImg('characters/' + id + '/' + s + '/' + n)
        );
      }
    }

    const cv = this.cv = document.createElement('canvas');
    cv.width = cv.height = this.S * dpr;
    cv.style.width = cv.style.height = this.S + 'px';

    this.ctx = cv.getContext('2d', { willReadFrequently: true });

    this.bub = document.createElement('div');
    this.bub.className = 'bub';

    this.typing = false;
    this.typingFrame = -1;
    this.typingUntil = 0;
    this.shakeX = 0;
    this.shakeY = 0;
    this.baseSize = this.S;
    this.waking = false;

    if (bubbleImg) {
      this.bub.classList.add('img');
      this.bub.style.setProperty('--bubble-img', 'url(shared/bubble.png)');
    }

    document.body.append(cv, this.bub);

    const order = Math.max(0, Number(id.match(/(\d+)$/)?.[1] || 1) - 1);
    const slots = [0.22, 0.5, 0.78];
    const saved = petPositions._pos || petPositions[id];

    Object.assign(this, {
      st:'idle',
      t0:0,
      dur:2200,
      x:Number.isFinite(saved?.x) ? saved.x : innerWidth * slots[order % slots.length],
      y:Number.isFinite(saved?.y) ? saved.y : innerHeight - 4,
      vx:0,
      vy:0,
      rot:0,
      rotVel:0,
      sq:0,
      dir:1,
      seated:false,
      tilt:0,
      flyT:0,
      drag:null,
      hist:[],
      bubUntil:0,
      nextChat:Infinity,
      order,
      nextBlink:performance.now() + 3500 + Math.random()*6500,
      blinkUntil:0,
      doubleBlink:false,
      secondBlinkAt:0
    });

    this.set('idle', 3000);
  }

  set(s, d) {
    this.st = s;
    this.t0 = performance.now();
    this.dur = d || 0;
    this.wakeAt = null;
    this.wakeReq = false;
  }

  requestWake(msg) {
    if (this.st === 'sleep') {
      this.wakeReq = true;
      this.wakeMsg = msg;
    }
  }

  say(t) {
    this.bub.classList.remove('recommend-card', 'fortune-card');
    this.bub.textContent = t;
    this.bubUntil = performance.now() + 2600;
  }

  sayRecommendation(name, description) {
    this.bub.classList.remove('fortune-card');
    this.bub.classList.add('recommend-card');
    this.bub.innerHTML =
      `<div class="rec-kicker">추천 메뉴</div><div class="rec-name"></div><div class="rec-desc"></div>`;

    this.bub.querySelector('.rec-name').textContent = name;
    this.bub.querySelector('.rec-desc').textContent = description;
    this.bubUntil = performance.now() + 4200;
  }

  sayFortune(score, text, lucky) {
    const n = Math.round(score / 20);

    this.bub.classList.add('recommend-card', 'fortune-card');
    this.bub.innerHTML =
      `<div class="rec-kicker">오늘의 간식 운세</div><div class="rec-name"><span class="rec-score"></span><span class="rec-stars"></span></div><div class="rec-desc"></div><div class="rec-lucky"></div>`;

    this.bub.querySelector('.rec-score').textContent = `행운 지수 ${score}점`;
    this.bub.querySelector('.rec-stars').textContent =
      '★'.repeat(n) + '☆'.repeat(5 - n);
    this.bub.querySelector('.rec-desc').textContent = text;
    this.bub.querySelector('.rec-lucky').textContent = `행운 메뉴 · ${lucky}`;
    this.bubUntil = performance.now() + 5200;
  }

  heart() {
    const h = document.createElement('span');
    h.className = 'heart';
    h.textContent = '♥';
    h.style.left = (this.x + Math.random()*50 - 25) + 'px';
    h.style.top = (this.y - this.fy + this.S*.15) + 'px';

    document.body.appendChild(h);
    setTimeout(() => h.remove(), 1000);
  }

  pick(now) {
    const r = Math.random();

    if (r < .045) {
      this.set('sleep', 18000 + Math.random()*14000);
    } else if (r < .22) {
      this.set('sit', 2500 + Math.random()*3500);
    } else {
      this.set('idle', 9000 + Math.random()*9000);
    }
  }

  wake() {
    this.idleSince = performance.now();
  }

  update(dt, now) {
    const p = this,
          S = p.S,
          G = innerHeight - 4,
          age = now - p.t0,
          st = p.st;

    if (p.idleSince === undefined) p.idleSince = now;

    p.sq = Math.max(0, p.sq - dt*4.5);

    if (st === 'wakeup' && age >= p.dur) {
      p.waking = false;
      p.set('idle', 5000 + Math.random()*5000);
    }

    if (st === 'sleep') {
      if (p.wakeAt == null && (age >= p.dur || p.wakeReq)) {
        const cyc = (p.frames.sleep?.length || 0) >= 5;
        const intro = 1440;
        const cycle = 2160;
        const f5 = 1440;

        let wait = 0;
        let hold = WAKE_HOLD;

        if (cyc) {
          const rel = age - intro;

          if (rel < 0) {
            wait = intro + f5 - age;
          } else {
            const pos = rel % cycle;

            if (pos < f5) {
              wait = f5 - pos;
            } else {
              hold = Math.max(300, WAKE_HOLD - (pos - f5));
            }
          }
        }

        p.wakeAt = now + wait;
        p.wakeHold = hold;
      }

      if (p.wakeAt != null && now >= p.wakeAt) {
        const m = p.wakeMsg;
        p.waking = true;

        p.wakeSeq = [
          [4, p.wakeHold],
          [1, WAKE_STEP],
          [0, WAKE_STEP]
        ];

        p.set(
          'wakeup',
          p.wakeSeq.reduce((a, q) => a + q[1], 0)
        );

        if (m) p.say(m);
      }
    }
    else if (st === 'idle' || st === 'sit') {
      if (now - lastInputAt > IDLE_SLEEP_MS && !p.typing) {
        p.set('sleep', Infinity);
      } else if (age > p.dur) {
        p.pick(now);
      }
    }

    if (p.typing && now >= p.typingUntil) {
      p.typing = false;
    }

    if (st === 'click' && age > 520) {
      p.set('idle', 2600 + Math.random()*2500);
    }

    p.x = clamp(p.x, S/2, Math.max(S/2, innerWidth-S/2));
    p.y = clamp(p.y, Math.min(S, G), innerHeight + S/2);

    p.rot += (0 - p.rot) * Math.min(1, dt*8);

    p.render(now, age);

    if (!p.typing) {
      p.shakeX = 0;
      p.shakeY = 0;
    }

    p.cv.style.transform =
      `translate(${p.x - S/2 + p.shakeX}px,${p.y - p.fy + p.shakeY}px) scaleX(${p.dir})`;

    if (now < p.bubUntil) {
      p.bub.style.opacity = 1;
      p.bub.style.transform =
        `translate(${clamp(p.x,60,innerWidth-60)}px,${p.y - p.fy - S*.08}px) translate(-50%,-100%)`;
    } else {
      p.bub.style.opacity = 0;
    }
  }

  render(now, age) {
    const { ctx, S, st } = this;

    let fr = this.frames[st + (this.seated ? '_chair' : '')];
    let sep = false;

    if (!fr && this.seated && this.frames[st]) {
      fr = this.frames[st];
      sep = true;
    }

    if (!fr && st !== 'wakeup') fr = this.frames.idle;
    if (!fr) fr = this.frames.idle;
    if (!fr || !fr.length) return;

    const fps = this.fps[st] || 6;
    const n = fr.length;
    let i;

    if (this.typing && this.frames.typing?.length) {
      fr = this.frames.typing;
      i = this.typingFrame % fr.length;

    } else if (st === 'wakeup' && this.frames.sleep?.length) {
      const sf = this.frames.sleep;
      const seq = this.wakeSeq || [
        [4, WAKE_HOLD],
        [1, WAKE_STEP],
        [0, WAKE_STEP]
      ];

      let acc = 0;
      let k = seq.length - 1;

      for (let j = 0; j < seq.length; j++) {
        if (age < acc + seq[j][1] || j === seq.length - 1) {
          k = j;
          break;
        }
        acc += seq[j][1];
      }

      i = Math.min(seq[k][0], sf.length - 1);
      fr = sf;

    } else if (st === 'idle' && n >= 2) {
      if (now >= this.nextBlink && now >= this.blinkUntil) {
        this.blinkUntil = now + 140;

        if (Math.random() < 0.28) {
          this.doubleBlink = true;
          this.secondBlinkAt = now + 300;
        } else {
          this.doubleBlink = false;
        }

        this.nextBlink = now + 4500 + Math.random()*6500;
      }

      if (
        this.doubleBlink &&
        now >= this.secondBlinkAt &&
        now < this.secondBlinkAt + 140
      ) {
        this.blinkUntil = Math.max(this.blinkUntil, now + 140);
      }

      if (
        this.doubleBlink &&
        now >= this.secondBlinkAt + 140
      ) {
        this.doubleBlink = false;
      }

      i = (now < this.blinkUntil) ? 1 : 0;

    } else if (st === 'sleep' && n >= 3) {
      const frameMs = 720;

      if (age < frameMs) {
        i = 0;
      } else if (age < frameMs * 2) {
        i = 1;
      } else if (n >= 5) {
        i = [2, 3, 4][
          Math.floor((age - frameMs * 2) / frameMs) % 3
        ];
      } else {
        i = Math.min(2, n - 1);
      }

    } else {
      i = NOLOOP.includes(st)
        ? Math.min(Math.floor(age*fps/1000), n-1)
        : Math.floor(age*fps/1000) % n;
    }

    if (!fr[i] || !fr[i].ok) return;

    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,S,S);

    if (sep) {
      if (chairImg && chairImg.ok) {
        ctx.drawImage(chairImg, 0, 0, S, S);
      } else {
        ctx.save();
        ctx.scale(S/200, S/200);
        chairShape(ctx);
        ctx.restore();
      }

      ctx.translate(0, -S*.13);
    }

    ctx.translate(S/2, this.fy);
    ctx.scale((1 + .28*this.sq), (1 - .3*this.sq));
    ctx.translate(-S/2, -this.fy);

    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    ctx.drawImage(fr[i], 0, 0, S, S);
  }

  shape(t, age) {
    const ctx = this.ctx,
          s = this.st,
          k = this.S/200,
          INK = '#1f2a44',
          seated = this.seated;

    ctx.setTransform(dpr*k,0,0,dpr*k,0,0);
    ctx.clearRect(0,0,200,200);

    let sx = 1,
        sy = 1,
        oy = 0,
        lift = 0,
        fa = 0,
        eye = 'open',
        mouth = 'smile';

    switch (s) {
      case 'idle': {
        if (t % 3200 < 140) eye = 'closed';
        break;
      }
      case 'sit': {
        sy = .82 + Math.sin(t/700)*.015;
        sx = 1.08;
        mouth = seated ? 'smile' : 'flat';
        if (seated) fa = Math.sin(t/600)*6;
        if (t % 3600 < 140) eye = 'closed';
        break;
      }
      case 'sleep': {
        sy = .7 + Math.sin(t/900)*.03;
        sx = 1.15;
        eye = 'closed';
        mouth = 'flat';
        break;
      }
      case 'click': {
        const j = Math.sin(Math.min(age/650,1)*Math.PI);
        oy = -j*34;
        sy = 1 + j*.08;
        eye = 'happy';
        mouth = 'open';
        break;
      }
    }

    sx *= 1 + .28*this.sq;
    sy *= 1 - .3*this.sq;

    if (seated) {
      chairShape(ctx);
      ctx.translate(0, -26);
    }

    const bottom = 164 + oy - (lift ? 10 : 0);
    const H = 96*sy;
    const cy = bottom - H/2;

    ctx.lineWidth = 4;
    ctx.strokeStyle = INK;
    ctx.lineJoin = ctx.lineCap = 'round';
    ctx.fillStyle = this.color;

    for (const q of [-1,1]) {
      const f = q < 0 ? fa : -fa;
      const up = Math.max(0,f)*.5;

      ctx.beginPath();
      ctx.ellipse(
        100 + q*24*sx + q*(s === 'sit' ? 6 : 0) + f*.5,
        bottom + 7 + (lift ? 8 : 0) - up,
        11, 8, 0, 0, 7
      );
      ctx.fill();
      ctx.stroke();
    }

    const top = cy - H/2;
    const sw = Math.sin(t/500)*4;

    ctx.beginPath();
    ctx.moveTo(100, top+2);
    ctx.quadraticCurveTo(100+sw, top-14, 100+sw*1.5+4, top-22);
    ctx.stroke();

    ctx.fillStyle = '#5ccf8b';
    ctx.beginPath();
    ctx.ellipse(100+sw*1.5+11, top-24, 11, 6, -.4, 0, 7);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.ellipse(100, cy, 55*sx, H/2, 0, 0, 7);
    ctx.fill();
    ctx.stroke();

    const ey = cy - H*.06;

    for (const q of [-1,1]) {
      const x0 = 104 + q*21*sx;

      ctx.globalAlpha = .8;
      ctx.fillStyle = '#ff9fb2';
      ctx.beginPath();
      ctx.ellipse(104 + q*35*sx, ey+14, 6, 4, 0, 0, 7);
      ctx.fill();
      ctx.globalAlpha = 1;

      ctx.fillStyle = INK;

      if (eye === 'open' || eye === 'wide') {
        const r = eye === 'wide' ? 8 : 6;

        ctx.beginPath();
        ctx.arc(x0, ey, r, 0, 7);
        ctx.fill();

        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(x0+2, ey-2, 2, 0, 7);
        ctx.fill();

      } else {
        ctx.beginPath();

        if (eye === 'closed') {
          ctx.moveTo(x0-6, ey);
          ctx.quadraticCurveTo(x0, ey+5, x0+6, ey);
        } else {
          ctx.moveTo(x0-6, ey+3);
          ctx.quadraticCurveTo(x0, ey-6, x0+6, ey+3);
        }

        ctx.stroke();
      }
    }

    const mx = 104;
    const my = ey + 16;

    ctx.fillStyle = INK;
    ctx.beginPath();

    if (mouth === 'smile') {
      ctx.moveTo(mx-5, my);
      ctx.quadraticCurveTo(mx, my+6, mx+5, my);
      ctx.stroke();
    } else if (mouth === 'flat') {
      ctx.moveTo(mx-4, my+2);
      ctx.lineTo(mx+4, my+2);
      ctx.stroke();
    } else if (mouth === 'open') {
      ctx.ellipse(mx, my+3, 5, 6, 0, 0, 7);
      ctx.fill();
    } else {
      ctx.arc(mx, my+3, 4, 0, 7);
      ctx.fill();
    }

    if (s === 'sleep') {
      ctx.fillStyle = INK;

      for (let i = 0; i < 3; i++) {
        const q = (t/1400 + i/3) % 1;
        ctx.globalAlpha = 1 - q;
        ctx.font = 'bold ' + (14 + q*8) + 'px sans-serif';
        ctx.fillText('z', 128 + q*22, cy - 20 - q*50);
      }

      ctx.globalAlpha = 1;
    }
  }

  hit(e) {
    const S = this.S;
    const vx0 = e.clientX - this.x;
    const vy0 = e.clientY - (this.y - this.fy + S*.6);
    const c = Math.cos(this.rot);
    const n = Math.sin(this.rot);

    const px = (vx0*c + vy0*n)*this.dir + S/2;
    const py = -vx0*n + vy0*c + S*.6;

    if (px < 0 || py < 0 || px >= S || py >= S) return false;

    return this.ctx.getImageData(
      Math.floor(px*dpr),
      Math.floor(py*dpr),
      1, 1
    ).data[3] > 20;
  }

  down(e) {
    this.drag = {
      sx:e.clientX,
      sy:e.clientY,
      ox:this.x,
      oy:this.y,
      moved:false
    };
    this.wake();
  }

  move(e) {
    if (!this.drag) return;

    const dx = e.clientX - this.drag.sx;
    const dy = e.clientY - this.drag.sy;

    if (Math.abs(dx) + Math.abs(dy) > 5) {
      this.drag.moved = true;
    }

    if (this.drag.moved) {
      this.x = clamp(
        this.drag.ox + dx,
        this.S/2,
        Math.max(this.S/2, innerWidth-this.S/2)
      );

      this.y = clamp(
        this.drag.oy + dy,
        Math.min(this.S, 0),
        innerHeight + this.S/2
      );
    }
  }

  up() {
    if (!this.drag) return;

    const moved = this.drag.moved;
    this.drag = null;

    if (moved) {
      petPositions[this.id] = {
        ...petPositions[this.id],
        x:this.x,
        y:this.y
      };

      petPositions._pos = { x:this.x, y:this.y };
      savePetPositions();
      return;
    }

    this.heart();

    const now = performance.now();
    const sleepy = this.st === 'sleep' || this.st === 'wakeup';

    this.clicks = (this.clicks || []).filter(t => now - t < 10000);
    this.clicks.push(now);

    this.sq = .55;
    this.set('click', 520);

    let reactions;

    if (sleepy) {
      reactions = SLEEPY_LINES;
    } else if (this.clicks.length >= 60) {
      reactions = ANNOY_LINES;
    } else {
      const characterLines = {
        char_01: FRIES_LINES,
        char_02: CHEESE_LINES,
        char_03: SOFTCON_LINES
      };

      const snackLines = characterLines[this.id] || [];
      const roll = Math.random();

      if (roll < 0.28) {
        reactions = HEALTH_LINES;
      } else if (roll < 0.53 && snackLines.length) {
        reactions = snackLines;
      } else {
        reactions = CLICK_LINES;
      }
    }

    this.say(pickLine(reactions));
  }

function chairShape(ctx) {
  ctx.lineWidth = 4;
  ctx.strokeStyle = '#1f2a44';
  ctx.lineJoin = ctx.lineCap = 'round';
  ctx.fillStyle = '#d4a46a';

  for (const r of [
    [26,88,12,74],
    [32,150,140,12],
    [32,162,12,16],
    [158,162,12,16]
  ]) {
    ctx.beginPath();
    ctx.roundRect(...r, 4);
    ctx.fill();
    ctx.stroke();
  }
}

function syncActive() {
  const list = pets.length ? [pets[pets.length - 1].id] : [];

  localStorage.setItem('active', JSON.stringify(list));
  ipcRenderer.send('active', list);
}

function removePet(id) {
  const i = pets.findIndex(p => p.id === id);

  if (i >= 0) {
    pets[i].remove();
    pets.splice(i, 1);
  }

  syncActive();
}

function togglePet(id) {
  if (pets.length === 1 && pets[0].id === id) {
    syncActive();
    return;
  }

  const prev = pets[pets.length - 1];

  for (const p of pets) p.remove();
  pets = [];

  const np = new Pet(id);

  if (prev) {
    np.x = prev.x;
    np.y = prev.y;
    np.dir = prev.dir;

    if (prev.S !== np.S) setPetSize(np, prev.S);

    petPositions._pos = { x:prev.x, y:prev.y };
    savePetPositions();
  }

  pets.push(np);
  syncActive();
}

ipcRenderer.on('toggle', (e, id) => togglePet(id));

ipcRenderer.invoke('ids').then(ids => {
  let a = [];

  try {
    a = JSON.parse(localStorage.getItem('active') || '[]');
  } catch {}

  const selected = a.find(id => ids.includes(id)) || ids[0];

  if (selected) togglePet(selected);
});

const topHit = e => {
  for (let i = pets.length-1; i >= 0; i--) {
    if (pets[i].hit(e)) return pets[i];
  }

  return null;
};

ipcRenderer.on('typing-activity', () => {
  const now = performance.now();

  lastTypingActivity = now;
  lastInputAt = now;

  for (const p of pets) {
    if (p.st === 'sleep' || p.st === 'wakeup') {
      p.waking = false;
      p.set('idle', 5000 + Math.random()*5000);
    }

    p.typing = true;
    p.typingUntil = now + 260;
    p.shakeX = Math.random() * 2 - 1;
    p.shakeY = Math.random() * 2 - 1;

    const frames = p.frames.typing || [];

    if (frames.length) {
      p.typingFrame = (p.typingFrame + 1) % Math.min(2, frames.length);
    }
  }
});

setInterval(() => {
  const now = performance.now();

  for (const p of pets) {
    if (p.typing && now >= p.typingUntil) {
      p.typing = false;
    }
  }
}, 30);

const front = p => {
  pets.splice(pets.indexOf(p), 1);
  pets.push(p);
  document.body.append(p.cv, p.bub);
};

const setOver = v => {
  if (v !== over) {
    over = v;
    ipcRenderer.send('ignore', !v);
  }
};

document.addEventListener('pointerdown', e => {
  // 메뉴 버튼을 클릭한 경우 캐릭터 클릭 처리를 하지 않음
  if (menu.contains(e.target)) {
    return;
  }

  // 메뉴 바깥을 클릭하면 메뉴 닫기
  menu.style.display = 'none';

  // 왼쪽 마우스 버튼만 캐릭터 조작에 사용
  if (e.button !== 0) return;

  const p = topHit(e);
  if (!p) return;

  dp = p;
  front(p);
  p.down(e);
  setOver(true);
});

document.addEventListener('pointermove', e => {
  mouseX = e.clientX;
  mouseY = e.clientY;
  lastInputAt = performance.now();

  if (dp) {
    dp.move(e);
    setOver(true);
    document.body.style.cursor = dp.drag?.moved ? 'grabbing' : 'pointer';
    return;
  }

  const p = topHit(e);

  setOver(!!p || menu.style.display === 'flex');
  document.body.style.cursor = p ? 'grab' : 'default';
});

document.addEventListener('pointerup', () => {
  if (dp) {
    dp.up();
    dp = null;
  }
});

document.addEventListener('contextmenu', e => {
  const p = topHit(e);

  if (p) {
    e.preventDefault();
    dp = null;
    p.drag = null;
    openMenu(p, e.clientX, e.clientY);
  }
});

function openMenu(p, cx, cy) {
  const groups = [
    [
      ['recommend','🍟 사이드 추천'],
      ['fortune','🔮 오늘의 간식 운세']
    ],
    [
      ['pat','❤️ 쓰다듬기'],
      [
        p.st === 'sleep' ? 'wakeup' : 'sleep',
        p.st === 'sleep' ? '☀️ 깨우기' : '💤 재우기'
      ]
    ],
    [
      ['switch','🔄 캐릭터 바꾸기'],
      ['size','🔍 크기 조절'],
      ['quit','🚪 종료하기']
    ]
  ];

  menu.innerHTML = '';

  groups.forEach((group, index) => {
    if (index > 0) {
      const divider = document.createElement('div');
      divider.className = 'menu-divider';
      menu.appendChild(divider);
    }

    for (const [k, label] of group) {
      const b = document.createElement('button');
      b.textContent = label;

      b.onclick = () => {
        if (k === 'switch') {
          showCharacterMenu(p, cx, cy);
          return;
        }

        if (k === 'size') {
          showSizeMenu(p, cx, cy);
          return;
        }

        menu.style.display = 'none';

        if (k === 'quit') {
          ipcRenderer.send('quit');
          return;
        }

        p.act(k);
      };

      menu.appendChild(b);
    }
  });

  menu.style.display = 'flex';
  setOver(true);

  menu.style.left = clamp(
    cx, 4, innerWidth - menu.offsetWidth - 4
  ) + 'px';

  menu.style.top = clamp(
    cy, 4, innerHeight - menu.offsetHeight - 4
  ) + 'px';
}

function setPetSize(p, size) {
  p.S = clamp(Math.round(size), 80, 420);
  p.fy = (p.cfg.feetY || .89) * p.S;

  p.cv.width = p.cv.height = p.S * dpr;
  p.cv.style.width = p.cv.style.height = p.S + 'px';

  p.x = clamp(
    p.x,
    p.S/2,
    Math.max(p.S/2, innerWidth - p.S/2)
  );

  petPositions[p.id] = {
    x:p.x,
    y:p.y,
    size:p.S
  };

  petPositions._pos = { x:p.x, y:p.y };
  savePetPositions();
}

function showSizeMenu(p, cx, cy) {
  menu.innerHTML = '';

  for (const [label, fn] of [
    ['➖ 작게', () => setPetSize(p, p.S * .88)],
    ['➕ 크게', () => setPetSize(p, p.S * 1.14)],
    ['↺ 기본 크기', () => setPetSize(p, p.cfg.size || 200)]
  ]) {
    const b = document.createElement('button');
    b.textContent = label;

    b.onclick = () => {
      fn();

      menu.style.display = 'flex';
      setOver(true);

      menu.style.left = clamp(
        cx, 4, innerWidth - menu.offsetWidth - 4
      ) + 'px';

      menu.style.top = clamp(
        cy, 4, innerHeight - menu.offsetHeight - 4
      ) + 'px';
    };

    menu.appendChild(b);
  }

  menu.style.display = 'flex';
  setOver(true);

  menu.style.left = clamp(
    cx, 4, innerWidth - menu.offsetWidth - 4
  ) + 'px';

  menu.style.top = clamp(
    cy, 4, innerHeight - menu.offsetHeight - 4
  ) + 'px';
}

document.addEventListener('wheel', e => {
  if (!e.ctrlKey) return;

  const p = topHit(e);
  if (!p) return;

  e.preventDefault();

  setPetSize(
    p,
    p.S * (e.deltaY < 0 ? 1.08 : 1 / 1.08)
  );
}, { passive: false });

function showCharacterMenu(current, cx, cy) {
  ipcRenderer.invoke('ids').then(ids => {
    menu.innerHTML = '';

    const activeIds = new Set(pets.map(p => p.id));
    const names = {
      char_01:'포떼링',
      char_02:'치떼링',
      char_03:'솦떼링'
    };

    for (const id of ids) {
      const b = document.createElement('button');

      b.textContent =
        (activeIds.has(id) ? '● ' : '○ ') + (names[id] || id);

      b.onclick = () => {
        menu.style.display = 'none';
        togglePet(id);
      };

      menu.appendChild(b);
    }

    menu.style.display = 'flex';
    setOver(true);

    menu.style.left = clamp(
      cx, 4, innerWidth - menu.offsetWidth - 4
    ) + 'px';

    menu.style.top = clamp(
      cy, 4, innerHeight - menu.offsetHeight - 4
    ) + 'px';
  });
}

let last = performance.now();

(function loop(now) {
  const dt = Math.min(now - last, 50)/1000;
  last = now;

  for (const p of pets) {
    p.update(dt, now);
  }

  requestAnimationFrame(loop);
})(last);
</script>
